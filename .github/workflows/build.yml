name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o ryn-the-journal.zip

      - name: Terapkan tema baru (jika ada)
        run: |
          if [ -f theme-override.css ]; then
            cp theme-override.css ryn-the-journal/www/style.css
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install & test
        working-directory: ryn-the-journal
        run: |
          npm install
          npm test

      - name: Add Android platform
        working-directory: ryn-the-journal
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ryn-the-journal
        run: npx cap sync android

      - name: Build APK
        working-directory: ryn-the-journal/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RYN-THE-JOURNAL-apk
          path: ryn-the-journal/android/app/build/outputs/apk/debug/app-debug.apk
